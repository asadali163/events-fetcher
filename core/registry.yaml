# Every source we pull events from. Edit this file by hand as you add sources.
#
# type: "api"     -> a real API like Ticketmaster, one base URL for every country
# type: "scraper" -> a website we scrape; if the URL differs per country, list
#                    each one under "urls"
#
# coverage: list of ISO country codes this source has events for,
#           or the string "global" if it truly covers everywhere.

sources:
  - id: ticketmaster
    type: api
    coverage: "global"
    entry_point: connectors.ticketing.ticketmaster.connector.TicketmasterConnector
    notes: "Discovery API covers most countries — one base URL, country passed as a search param"

  - id: dice
    type: scraper
    coverage: ["FR", "CA"]
    entry_point: connectors.ticketing.dice.connector.DiceConnector
    notes: "Playwright scraper — city-specific browse-page slug, only Paris mapped so far"

  - id: songkick
    type: scraper
    coverage: ["HU", "FR", "BE", "CA"]
    entry_point: connectors.ticketing.songkick.connector.SongkickConnector
    notes: "requests + BeautifulSoup scraper — city-specific metro-area path, only Budapest mapped so far"

  - id: openagenda
    type: api
    coverage: ["FR"]
    entry_point: connectors.ticketing.openagenda.connector.OpenAgendaConnector
    notes: "Agenda search by city + geo bounding box — city-specific center point, only Paris and Lyon mapped so far"

  - id: bandsintown
    type: scraper
    coverage: ["FR", "GB", "US", "CA", "BE"]
    entry_point: connectors.ticketing.bandsintown.connector.BandsintownConnector
    notes: "Selenium + undetected-chromedriver scraper (switched from Playwright — Cloudflare was detecting the Playwright/CDP connection itself); needs a one-time manual login (see login.py in its folder); degrades to first-page-only results without a saved session"

  - id: meetup
    type: scraper
    coverage: ["FR"]
    entry_point: connectors.ticketing.meetup.connector.MeetupConnector
    notes: "Playwright scraper — 50+ attendee events only (deliberate); no date-range filter, so refetches on a 10-day timer instead of a date window (REFETCH_INTERVAL_DAYS); only Paris mapped so far"

  - id: universe
    type: scraper
    coverage: ["NL", "BE", "CA"]
    entry_point: connectors.ticketing.universe.connector.UniverseConnector
    notes: "Playwright + BeautifulSoup scraper — city-specific center point for search, only Amsterdam mapped so far; no date filter at all (days_ahead forced to None), refetches on a 10-day timer instead (REFETCH_INTERVAL_DAYS), same pattern as Meetup; venue location resolved via reverse-geocoding the scraped address, not the searched city"

  # - id: stubhub
  #   type: scraper
  #   coverage: ["FR", "BE", "CA", "NL", "HU", "LU"]
  #   entry_point: connectors.ticketing.stubhub.connector.StubHubConnector
  #   notes: "Playwright + BeautifulSoup scraper — genuinely supports server-side date-range filtering (from/to), so days_ahead works normally, unlike Meetup/Universe; needs a per-city (lat, lon, timezone) tuple, only Paris mapped so far; bare venue names are geocoded with a distance sanity check against the city center, since a name alone can match the wrong place entirely"

  - id: luxembourg_city
    type: scraper
    coverage: ["LU"]
    entry_point: connectors.ticketing.luxembory_specific.connector.LuxembourgCityConnector
    notes: "Playwright + BeautifulSoup scraper for luxembourg-city.com's What's On page — single-city site only (raises ValueError for any city other than Luxembourg City); genuinely supports server-side date filtering plus a Python-side safety net; deliberately keeps single-date events only, skips date ranges; gives first-party coordinates via each event's own Google Maps link, no geocoding API needed. Folder name has a typo (luxembory_specific), kept as-is."

